name: Audit Hunt Scanner

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger

# Cancel any in-progress run the moment a new one is triggered
concurrency:
  group: scanner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── DJ scanner ─────────────────────────────────────────────────────────────
  scan-dj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install python-jobspy pandas requests python-dotenv groq

      - name: Run DJ scanner
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC:    ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:   ${{ github.repository }}
        run: python master_hunter.py

      - name: Upload DJ CSV
        uses: actions/upload-artifact@v4
        with:
          name: dj-leads
          path: Scored_Audit_Leads.csv

  # ── Pooja scanner ──────────────────────────────────────────────────────────
  scan-pooja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install python-jobspy pandas requests python-dotenv groq

      - name: Run Pooja scanner
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          POOJA_NTFY_TOPIC:  ${{ secrets.POOJA_NTFY_TOPIC }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:       ${{ github.repository }}
        run: python pooja_hunter.py

      - name: Upload Pooja CSV
        uses: actions/upload-artifact@v4
        with:
          name: pooja-leads
          path: Scored_Pooja_Leads.csv

  # ── Commit both CSVs once both scanners finish ──────────────────────────────
  commit:
    needs: [scan-dj, scan-pooja]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/download-artifact@v4
        with:
          name: dj-leads

      - uses: actions/download-artifact@v4
        with:
          name: pooja-leads

      - name: Commit CSVs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add Scored_Audit_Leads.csv Scored_Pooja_Leads.csv
          git diff --cached --quiet && echo "No CSV changes" && exit 0
          git commit -m "chore: auto-scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main
