name: Audit Hunt Scanner

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # manual trigger

# Cancel any in-progress run the moment a new one is triggered
concurrency:
  group: scanner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── DJ scanner ─────────────────────────────────────────────────────────────
  scan-dj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install python-jobspy pandas requests python-dotenv groq

      - name: Run DJ scanner
        env:
          GROQ_API_KEY:  ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC:    ${{ secrets.NTFY_TOPIC }}
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:   ${{ github.repository }}
        run: python master_hunter.py

      - name: Commit DJ CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --soft origin/main
          git add Scored_Audit_Leads.csv
          git diff --cached --quiet && echo "No DJ CSV changes" && exit 0
          git commit -m "chore: auto-scan DJ $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main || (git pull --rebase origin main && git push origin main)

  # ── Pooja scanner ──────────────────────────────────────────────────────────
  scan-pooja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install python-jobspy pandas requests python-dotenv groq

      - name: Run Pooja scanner
        env:
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          POOJA_NTFY_TOPIC:  ${{ secrets.POOJA_NTFY_TOPIC }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO:       ${{ github.repository }}
        run: python pooja_hunter.py

      - name: Commit Pooja CSV
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --soft origin/main
          git add Scored_Pooja_Leads.csv
          git diff --cached --quiet && echo "No Pooja CSV changes" && exit 0
          git commit -m "chore: auto-scan Pooja $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin main || (git pull --rebase origin main && git push origin main)
